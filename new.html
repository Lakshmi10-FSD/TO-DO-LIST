<html>
<head>
<title>Advanced To-Do</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body id="body" class="bg-gray-100 flex justify-center items-center min-h-screen transition">

<div id="container" class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md transition">

<h1 class="text-2xl font-bold text-center mb-3">🚀 Advanced To-Do</h1>

<button onclick="toggleDark()" class="w-full mb-3 bg-black text-white p-2 rounded">
Toggle Dark Mode
</button>

<!-- Search -->
<input id="searchInput" type="text" placeholder="Search task..."
class="border p-2 w-full mb-2 rounded" oninput="render()">

<!-- Task Input -->
<input id="taskInput" type="text" placeholder="Enter task"
class="border p-2 w-full mb-2 rounded">

<input id="dateInput" type="datetime-local"
class="border p-2 w-full mb-2 rounded">

<!-- Priority -->
<select id="priorityInput" class="border p-2 w-full mb-2 rounded">
<option value="Low">Low Priority</option>
<option value="Medium">Medium Priority</option>
<option value="High">High Priority</option>
</select>

<!-- Category -->
<select id="categoryInput" class="border p-2 w-full mb-2 rounded">
<option value="Work">Work</option>
<option value="Personal">Personal</option>
<option value="Study">Study</option>
</select>

<button onclick="addTask()" class="bg-blue-500 text-white w-full p-2 rounded mb-3">
Add Task
</button>

<!-- Sort -->
<select onchange="sortTasks(this.value)" class="border p-2 w-full mb-3 rounded">
<option value="">Sort By</option>
<option value="date">By Date</option>
<option value="priority">By Priority</option>
</select>

<!-- Stats -->
<div class="text-sm mb-2">
Completed: <span id="doneCount">0</span> | Remaining: <span id="leftCount">0</span>
</div>

<!-- Progress -->
<div class="w-full bg-gray-200 rounded mb-3">
<div id="progressBar" class="bg-green-500 text-xs text-white text-center rounded" style="width:0%">0%</div>
</div>

<!-- Actions -->
<div class="flex gap-2 mb-3">
<button onclick="markAll()" class="bg-green-500 text-white w-1/2 p-2 rounded">Mark All</button>
<button onclick="clearCompleted()" class="bg-yellow-500 text-white w-1/2 p-2 rounded">Clear Done</button>
</div>

<ul id="taskList"></ul>

<p id="emptyMsg" class="text-center text-gray-400 mt-2 hidden">No tasks 😴</p>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let darkMode = localStorage.getItem("dark") === "true";

// Dark mode apply
if(darkMode) toggleDark();

function save(){
localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask(){
let text = taskInput.value.trim();
if(!text){ alert("Enter task"); return; }

tasks.push({
text,
date: dateInput.value,
priority: priorityInput.value,
category: categoryInput.value,
completed:false
});

taskInput.value="";
dateInput.value="";
save();
render();
}

function deleteTask(i){
tasks.splice(i,1);
save();
render();
}

function toggleTask(i){
tasks[i].completed = !tasks[i].completed;
save();
render();
}

function markAll(){
tasks.forEach(t => t.completed = true);
save();
render();
}

function clearCompleted(){
tasks = tasks.filter(t => !t.completed);
save();
render();
}

function sortTasks(type){
if(type==="date"){
tasks.sort((a,b)=> new Date(a.date)-new Date(b.date));
}
if(type==="priority"){
let order = {High:1, Medium:2, Low:3};
tasks.sort((a,b)=> order[a.priority]-order[b.priority]);
}
render();
}

function render(){
let list = document.getElementById("taskList");
let search = searchInput.value.toLowerCase();
list.innerHTML="";

let filtered = tasks.filter(t => t.text.toLowerCase().includes(search));

if(filtered.length === 0){
emptyMsg.classList.remove("hidden");
}else{
emptyMsg.classList.add("hidden");
}

filtered.forEach((t,i)=>{
let color = t.priority==="High" ? "red" : t.priority==="Medium" ? "yellow" : "green";

let li = document.createElement("li");
li.className="bg-gray-100 p-3 mb-2 rounded";

li.innerHTML=`
<div class="flex justify-between">
<span onclick="toggleTask(${i})"
class="cursor-pointer ${t.completed?'line-through text-gray-500':''}">
${t.text}
</span>

<button onclick="deleteTask(${i})" class="text-red-500">X</button>
</div>

<div class="text-xs mt-1 flex justify-between">
<span class="text-${color}-500">${t.priority}</span>
<span>${t.category}</span>
</div>

<p class="text-xs text-gray-500">${t.date ? new Date(t.date).toLocaleString() : ""}</p>
`;

list.appendChild(li);

// Title notification
if(t.date && !t.completed){
if(new Date(t.date) < new Date()){
document.title = "⚠️ Task Overdue!";
}
}
});

// Stats
let done = tasks.filter(t=>t.completed).length;
let left = tasks.length - done;

doneCount.innerText = done;
leftCount.innerText = left;

// Progress
let percent = tasks.length ? (done/tasks.length)*100 : 0;
progressBar.style.width = percent+"%";
progressBar.innerText = Math.round(percent)+"%";

}

// Dark Mode
function toggleDark(){
body.classList.toggle("bg-gray-900");
body.classList.toggle("text-white");

container.classList.toggle("bg-gray-800");
container.classList.toggle("text-white");

darkMode = !darkMode;
localStorage.setItem("dark", darkMode);
}

render();
</script>

</body>
</html>
